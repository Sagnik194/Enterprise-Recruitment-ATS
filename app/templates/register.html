{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4">
<h2>Create your account</h2><p class="text-muted">Join Enterprise Recruitment ATS</p>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form action="/register" method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label class="form-label" for="full_name">Full name</label><input id="full_name" class="form-control mb-3" name="full_name" minlength="2" maxlength="120" value="{{ values.get('full_name','') }}" required>
<label class="form-label" for="email">Email address</label><input id="email" type="email" class="form-control mb-3" name="email" maxlength="255" value="{{ values.get('email','') }}" autocomplete="email" required>
<label class="form-label" for="role">Register as</label><select id="role" class="form-select mb-3" name="role" required>
<option value="candidate" {% if values.get('role','candidate') == 'candidate' %}selected{% endif %}>Candidate</option>
<option value="recruiter" {% if values.get('role') == 'recruiter' %}selected{% endif %}>Recruiter (admin approval required)</option></select>
<label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control mb-3" name="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label class="form-label" for="confirm_password">Confirm password</label><input id="confirm_password" type="password" class="form-control mb-3" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required>
<p class="text-muted small">Use at least 12 characters. Recruiter accounts require approval before access.</p>
<button class="btn btn-primary w-100">Create Account</button></form><p class="text-center mt-3 mb-0">Already registered? <a href="/login">Sign in</a></p>
</div></div></div></div>
{% endblock %}
